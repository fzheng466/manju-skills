name: guard
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s core/tests -t .
      - run: python -m unittest discover -s skill-H3/scripts -p "test_*.py"
      - run: python -m unittest discover -s skill-SD/scripts -p "test_*.py"
      - run: python build/check_drift.py
      - name: vendored skill-SD lexicon still loads
        run: |
          python - <<'PY'
          import sys, tempfile, shutil
          from pathlib import Path
          src = Path('skill-SD')
          with tempfile.TemporaryDirectory() as td:
              dest = Path(td)/'skill-SD'
              shutil.copytree(src, dest)
              sys.path.insert(0, str(dest))
              from _core.lib.transpile import load_lexicon
              rows = load_lexicon()
              assert rows, 'lexicon empty after isolated skill-SD copy'
          PY
      - name: examples/channels is not gitignored
        run: git check-ignore -q examples/channels/local-template.json && exit 1 || exit 0
      - name: no leftover marketing claims
        run: |
          if grep -REn '99%|Midjourney|@image_keyframe' --include='*.md' skill-SD/references/versions; then
            exit 1
          fi
          if grep -n '。###' skill-H3/references/project-contract.md; then
            exit 1
          fi
          if grep -nE '^```[^`\n]+.+' skill-H3/references/project-contract.md | grep -vE '^[^:]+:```(json|text|md)$'; then
            exit 1
          fi
